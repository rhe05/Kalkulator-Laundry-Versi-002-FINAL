    <section class="screen" id="screenBEP">
      <div class="bep-screen-body">
        <div class="dashboard-header">
          <div class="dashboard-header-top">
            <div class="dashboard-header-text">
              <h1 class="dashboard-title">Target &amp; Potensi</h1>
            </div>
            <div class="dashboard-filter-right">
              <button class="outlet-filter-pill" type="button" id="bepScreenOutletFilter" onclick="openOutletPicker()">

              </button>
              <div class="outlet-count-label" id="bepScreenOutletCountLabel"></div>
            </div>
          </div>
        </div>

        <div class="bep-screen-grid">
          <div class="panel bep-screen-panel">
            <div class="desktop-panel-title">Target Titik Impas (BEP)</div>
            <div id="bepScreenBEPContent" class="dashboard-card-summary is-loading">Memuat data...</div>
          </div>
          <div class="panel bep-screen-panel">

        </div>
